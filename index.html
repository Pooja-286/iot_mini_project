<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExhibitGuard - Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  padding:20px;background:#f4f7fb;color:#17253c;
  font-family:Arial,sans-serif
}
.login-card{
  width:100%;max-width:400px;padding:35px;background:white;
  border:1px solid #e7edf5;border-radius:18px;
  box-shadow:0 15px 45px #17253c12
}
.brand{font-size:27px;font-weight:800;margin-bottom:8px}
.brand span{color:#0aa99a}
.subtitle{font-size:11px;color:#7a899e;letter-spacing:1.5px}
h2{font-size:24px;margin:28px 0 8px}
.intro{font-size:13px;color:#7a899e;line-height:1.6;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:bold;margin:17px 0 7px}
input{
  width:100%;padding:13px;border:1px solid #dce5ef;
  border-radius:8px;font-size:14px;outline:none
}
input:focus{border-color:#0aa99a}
button{
  width:100%;padding:13px;margin-top:22px;border:0;
  border-radius:8px;background:#0aa99a;color:white;
  font-size:14px;font-weight:bold;cursor:pointer
}
button:hover{background:#078f83}
button:disabled{opacity:.6;cursor:wait}
#message{font-size:12px;line-height:1.5;color:#d94253}
.note{font-size:11px;color:#8492a6;margin-top:24px;text-align:center}
</style>
</head>

<body>
<div class="login-card">
  <div class="brand">Exhibit<span>Guard</span></div>
  <div class="subtitle">SECURITY PLATFORM</div>

  <h2>Welcome back</h2>
  <p class="intro">Sign in to access your security command center.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="Enter email"
           autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password"
           autocomplete="current-password" required>

    <button id="loginButton" type="submit">Sign In</button>
    <p id="message" role="status"></p>
  </form>

  <div class="note">Secure access · ExhibitGuard Monitoring</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCMvePll_304p4YFguN5gg_qFaQTMA50sM",
  authDomain: "smart-exhibit-security.firebaseapp.com",
  databaseURL: "https://smart-exhibit-security-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-exhibit-security",
  storageBucket: "smart-exhibit-security.firebasestorage.app",
  messagingSenderId: "528561962471",
  appId: "1:528561962471:web:050e3d4d8c547b957b5142"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

auth.onAuthStateChanged(user => {
  if (user) {
    window.location.replace("dashboard.html");
  }
});

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  button.disabled = true;
  message.textContent = "Signing in...";

  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );

    window.location.replace("dashboard.html");
  } catch (error) {
    const messages = {
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/user-not-found": "Account not found.",
      "auth/wrong-password": "Incorrect email or password.",
      "auth/invalid-email": "Please enter a valid email.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Check your internet connection."
    };

    message.textContent = messages[error.code] || error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
